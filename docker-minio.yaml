version: "3.8"

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio_server
    ports:
      - "9000:9000" # Port untuk API (S3)
      - "9001:9001" # Port untuk Console (Dashboard Web)
    environment:
      MINIO_ROOT_USER: alpha123
      MINIO_ROOT_PASSWORD: alpha123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
