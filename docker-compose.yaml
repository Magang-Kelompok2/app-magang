version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16  # ✅ BENAR - pgvector sudah ada
    container_name: kapha-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: KAPHikmahArief
      POSTGRES_PASSWORD: KAPHA_secret_2026
      POSTGRES_DB: KAPHA_db
    volumes:
      - kapha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U KAPHikmahArief -d KAPHA_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kapha_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kapha-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kapha.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: 'False'
      PGADMIN_CONFIG_COOKIE_SAMESITE: 'Lax'
    volumes:
      - kapha_pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kapha_network

volumes:
  kapha_pgdata:
  kapha_pgadmin:

networks:
  kapha_network:
    driver: bridge